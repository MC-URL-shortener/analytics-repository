name: Test and push to docker hub

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.25
    - name: Execute tests
      run: go test -v ./...

  push_a_docker_hub:
    runs-on: ubuntu-latest
    needs:
      - run_tests

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/analyticsservice:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/analyticsservice:${{ github.sha }}
